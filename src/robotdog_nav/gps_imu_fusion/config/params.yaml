# Parameters for GPS/IMU fusion node

gps_imu_fusion_node:
  ros__parameters:
    # Origin coordinates for local coordinate system
    # origin_lat: 37.7749  # Latitude of origin point
    # origin_lon: -122.4194  # Longitude of origin point
    # origin_alt: 0.0  # Altitude of origin point

    origin_lat: 0.0  # Latitude of origin point
    origin_lon: 0.0  # Longitude of origin point
    origin_alt: 0.0  # Altitude of origin point
    # origin_lat: 47.3667
    # origin_lon: 8.55000
    # origin_alt: 500.258947

    # Yaw offset for compass heading correction (in radians)
    yaw_offset: 3.14159  # Compass yaw offset in radians

    # Whether to use only yaw from IMU (discard roll and pitch)
    # Set to false to enable complementary filter for roll/pitch estimation
    use_yaw_only: false

    # Complementary filter for roll/pitch estimation (fuses accelerometer + gyroscope)
    # This provides dynamic roll/pitch tracking that follows actual body tilt
    use_complementary_filter: true
    complementary_filter_alpha: 0.98  # Filter gain: 0.98*gyro + 0.02*accel (higher = trust gyro more)