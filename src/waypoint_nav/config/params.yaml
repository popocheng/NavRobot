# Navigation parameters for waypoint navigation with obstacle avoidance

nav_waypoint_node:
  ros__parameters:
    # Basic navigation parameters
    origin_lat: 0.0  # Latitude of origin point
    origin_lon: 0.0  # Longitude of origin point
    origin_alt: 0.0  # Altitude of origin point

    # Tolerance for reaching a goal (meters)
    goal_tolerance: 1.0

    # Tolerance for yaw angle (radians)
    yaw_tolerance: 0.8

    # Linear velocity (m/s)
    linear_velocity: 0.8

    # Angular velocity limit (rad/s)
    angular_velocity_limit: 1.0

    # Control frequency (Hz)
    control_frequency: 10.0

    # Lookahead distance for path following (meters)
    lookahead_distance: 2.0

    # Robot physical parameters
    robot_radius: 0.5

    # Transform tolerance
    transform_tolerance: 0.2

    # Navigation2 integration parameters
    robot_base_frame: "base_link"
    global_frame: "world"

    # Controller selection: true for using controller_server with FollowPath (with obstacle avoidance),
    # false for using pure pursuit algorithm directly
    use_controller_server: true

# Local costmap parameters for obstacle detection and avoidance
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: world
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      transform_tolerance: 0.5
      footprint: '[[0.5, 0.3], [0.5, -0.3], [-0.5, -0.3], [-0.5, 0.3]]'
      plugins: [
        "temporal_layer",
        "inflation_layer"
      ]
      temporal_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        voxel_decay: 0.5  # seconds for a full decay
        decay_model: 0   # 0=linear, 1=exponential
        voxel_size: 0.05  # meters
        track_unknown_space: false
        observation_sources: pointcloud
        pointcloud:  # This name must match the topic name
          topic: /livox/lidar
          max_obstacle_height: 1.0
          min_obstacle_height: 0.3
          obstacle_range: 10.0
          raytrace_range: 10.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          sensor_frame: "livox"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# Controller parameters for local path planning and obstacle avoidance
controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /world_odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters - increased tolerance to prevent "failed to make progress" errors
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1  # Reduced from default to be more permissive
      movement_time_allowance: 10.0  # Increased time allowance before declaring stuck

    # Goal checker parameters
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.8  # Increased tolerance to prevent oscillation
      yaw_goal_tolerance: 0.7  # Increased tolerance to prevent oscillation
      stateful: true

    # DWB parameters for local trajectory planning
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      # ---------- 速度参数（更保守） ----------
      min_vel_x: 0.0              # 允许停下来（关键）
      min_vel_y: 0.0
      max_vel_x: 0.6              # 略降最大速度
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.05          # 允许慢速移动（关键）
      max_speed_xy: 0.5
      min_speed_theta: 0.1        # 允许慢速旋转
      # ---------- 加速度（更温和） ----------
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      # ---------- 采样（更密，提高避障能力） ----------
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 30
      # ---------- 轨迹模拟 ----------
      sim_time: 2.0               # 更长预测（关键）
      linear_granularity: 0.05    # 更精细
      angular_granularity: 0.05
      transform_tolerance: 0.3
      # ---------- 目标容忍 ----------
      xy_goal_tolerance: 0.5
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      # ---------- critic ----------
      critics: ["RotateToGoal", "GoalAlign", "PathAlign", "PathDist", "GoalDist", "BaseObstacle"]
      # 🔴 ---------- 核心：避障增强 ----------
      BaseObstacle.scale: 0.2     # 从 0.01 → 0.2（大幅增强）
      # ---------- 路径 & 目标（降低“硬跟随”） ----------
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 12.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 12.0
      GoalDist.scale: 20.0
      # ---------- 旋转 ----------
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0