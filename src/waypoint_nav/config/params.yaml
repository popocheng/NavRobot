# Navigation parameters for waypoint navigation with obstacle avoidance

nav_waypoint_node:
  ros__parameters:
    # Basic navigation parameters
    origin_lat: 0.0  # Latitude of origin point
    origin_lon: 0.0  # Longitude of origin point
    origin_alt: 0.0  # Altitude of origin point

    # Tolerance for reaching a goal (meters)
    goal_tolerance: 1.0

    # Tolerance for yaw angle (radians)
    yaw_tolerance: 0.8

    # Linear velocity (m/s)
    linear_velocity: 0.8

    # Angular velocity limit (rad/s)
    angular_velocity_limit: 1.0

    # Control frequency (Hz)
    control_frequency: 10.0

    # Lookahead distance for path following (meters)
    lookahead_distance: 2.0

    # Robot physical parameters
    robot_radius: 0.5

    # Transform tolerance
    transform_tolerance: 0.2

    # Navigation2 integration parameters
    robot_base_frame: "base_link"
    global_frame: "world"

    # Controller selection: true for using controller_server with FollowPath (with obstacle avoidance),
    # false for using pure pursuit algorithm directly
    use_controller_server: true

# Local costmap parameters for obstacle detection and avoidance
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: world
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      transform_tolerance: 0.5
      footprint: '[[0.5, 0.3], [0.5, -0.3], [-0.5, -0.3], [-0.5, 0.3]]'
      plugins: [
        "temporal_layer",
        "inflation_layer"
      ]
      temporal_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        voxel_decay: 1.44  # seconds for a full decay
        decay_model: 0   # 0=linear, 1=exponential
        voxel_size: 0.05  # meters
        track_unknown_space: false
        observation_sources: pointcloud
        pointcloud:  # This name must match the topic name
          topic: /livox/lidar
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          obstacle_range: 2.5
          raytrace_range: 3.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          sensor_frame: "livox_frame"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# Controller parameters for local path planning and obstacle avoidance
controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /world_odom
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker parameters
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    # DWB parameters for local trajectory planning
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 40
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0